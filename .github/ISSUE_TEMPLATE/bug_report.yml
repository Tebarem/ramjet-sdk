name: Bug report
description: Something in the plugin API, the template, a sample or the docs does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal plugin code
      description: The smallest plugin code that shows the problem.
      render: csharp
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: The relevant lines of the server log (lines starting with your plugin's name, errors and stack traces).
      render: text
  - type: input
    id: version
    attributes:
      label: Ramjet.Api version
      placeholder: 1.0.0-preview.7
    validations:
      required: true
