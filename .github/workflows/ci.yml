name: CI

# Packs Ramjet.Api and Ramjet.Templates and proves they work: the samples and a fresh project from the template build against the packed
# Ramjet.Api. Packing Ramjet.Api first runs tools/ApiCheck in verify mode on the committed reference assembly (public API only, no code,
# no build traces, identical to src/Ramjet.Api/Mc.Scripting.Api.surface.txt). publish-nuget.yml runs this first and publishes its packages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Versions agree (package, template default, samples)
        shell: python
        run: |
          import json, re, sys
          api = re.search(r"<Version>([^<]+)</Version>", open("src/Ramjet.Api/Ramjet.Api.csproj").read()).group(1)
          template = json.load(open("templates/ramjet-plugin/.template.config/template.json"))["symbols"]["RamjetApiVersion"]["defaultValue"]
          samples = re.search(r"<RamjetApiVersion[^>]*>([^<]+)</RamjetApiVersion>", open("samples/Directory.Build.props").read()).group(1)
          print(f"Ramjet.Api {api}; template default {template}; samples {samples}")
          if not (api == template == samples):
              sys.exit("the template's RamjetApiVersion default and samples/Directory.Build.props must name the Ramjet.Api version")

      - name: Pack Ramjet.Api (verifies the reference assembly first)
        run: dotnet pack src/Ramjet.Api -c Release -o artifacts

      - name: Pack Ramjet.Templates
        run: dotnet pack templates -c Release -o artifacts

      - name: Samples build against the packed Ramjet.Api
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: dotnet build samples/Samples.slnx -c Release -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/artifacts"

      - name: A project from the template builds
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          dotnet new install artifacts/Ramjet.Templates.*.nupkg
          dotnet new ramjet-plugin -n CiPlugin -o "$RUNNER_TEMP/CiPlugin" --Author ci --PluginDescription "CI check"
          dotnet build "$RUNNER_TEMP/CiPlugin" -c Release -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/artifacts"
          # the API is compile-time only: it must never be copied next to a plugin
          if find "$RUNNER_TEMP/CiPlugin/bin" -name 'Mc.Scripting.Api.dll' | grep -q .; then echo "Mc.Scripting.Api.dll in the plugin output"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error
