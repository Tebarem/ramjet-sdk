# Packs Ramjet.Templates and pushes it to nuget.org with trusted publishing (no long-lived API key).
#
# Release: bump <Version> in templates/Ramjet.Templates.csproj, then push a matching tag:
#   git tag v1.0.0-preview.2 && git push origin v1.0.0-preview.2
# Manual runs (workflow_dispatch) pack and publish whatever version the csproj holds.
#
# One-time setup on nuget.org (Account > Trusted Publishing): add a GitHub Actions policy with
#   owner: Tebarem, repository: ramjet-sdk, workflow file: publish-nuget.yml, environment: nuget
# and add the repository secret NUGET_USER = the nuget.org profile name (not the email) that owns the policy.

name: Publish to NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read package version
        id: version
        run: |
          version="$(dotnet msbuild templates/Ramjet.Templates.csproj -getProperty:Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Ramjet.Templates $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the csproj version (expected v$version)"
            exit 1
          fi

      - name: Pack
        run: dotnet pack templates/Ramjet.Templates.csproj -c Release -o artifacts

      - name: Smoke test the template
        run: |
          dotnet new install "artifacts/Ramjet.Templates.${{ steps.version.outputs.version }}.nupkg"
          dotnet new ramjet-plugin -n SmokePlugin -o "$RUNNER_TEMP/SmokePlugin"
          test -f "$RUNNER_TEMP/SmokePlugin/SmokePlugin.csproj"
          test -f "$RUNNER_TEMP/SmokePlugin/plugin.json"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # lets NuGet/login exchange the GitHub OIDC token for a short-lived nuget.org API key
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
